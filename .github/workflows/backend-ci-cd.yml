name: Backend CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'

env:
  AWS_REGION: us-east-1
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: testuser
          MONGO_INITDB_ROOT_PASSWORD: testpass
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
      
      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        working-directory: backend/MuchToDo
        run: go mod download

      - name: Run unit tests
        working-directory: backend/MuchToDo
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run integration tests
        working-directory: backend/MuchToDo
        env:
          INTEGRATION: 'true'
          MONGO_URI: mongodb://testuser:testpass@localhost:27017/test?authSource=admin
          REDIS_ADDR: localhost:6379
        run: go test -v -tags=integration --timeout=30s ./...

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          files: backend/MuchToDo/coverage.out
          flags: unittests
          fail_ci_if_error: false

      - name: Run code quality checks with golangci-lint
        working-directory: backend/MuchToDo
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./... --timeout 5m

      - name: Security scanning with gosec
        working-directory: backend/MuchToDo
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./... -fmt json -out gosec-report.json || true

      - name: Upload security scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: backend/MuchToDo/gosec-report.json

  build:
    needs: test
    runs-on: ubuntu-latest
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    permissions:
      contents: read
      packages: write
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v4
        with:
          context: ./backend/MuchToDo
          file: ./backend/MuchToDo/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/backend:buildcache,mode=max

      - name: Run Trivy container image vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container-scan'

      - name: Scan Docker image with Grype
        uses: anchore/scan-action@v3
        id: grype
        with:
          image: ${{ steps.meta.outputs.tags }}
          fail-build: false
          severity-cutoff: high

      - name: Upload Grype results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment:
      name: production
      url: https://${{ secrets.ALB_DNS }}/health
    
    permissions:
      contents: read
      deployments: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          description: Deploying backend API - commit ${{ github.sha }}
          auto_merge: false

      - name: Get current Auto Scaling Group
        id: asg
        run: |
          ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
            --query 'AutoScalingGroups[?Tags[?Key==`Environment` && Value==`production`]].AutoScalingGroupName' \
            --output text | head -n1)
          echo "asg-name=${ASG_NAME}" >> $GITHUB_OUTPUT

      - name: Get target instances from ASG
        id: instances
        run: |
          INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ${{ steps.asg.outputs.asg-name }} \
            --query 'AutoScalingGroups[0].Instances[*].InstanceId' \
            --output text)
          echo "instance-ids=${INSTANCES}" >> $GITHUB_OUTPUT

      - name: Check ALB health before deployment
        run: |
          echo "Checking ALB health status..."
          for i in {1..3}; do
            HEALTH=$(aws elbv2 describe-target-health \
              --target-group-arn ${{ secrets.ALB_TARGET_GROUP_ARN }} \
              --query 'TargetHealthDescriptions[*].[Target.Id,TargetHealth.State]' \
              --output text)
            echo "Health check iteration $i:"
            echo "$HEALTH"
            sleep 5
          done

      - name: Pull latest Docker image on EC2 instances
        run: |
          INSTANCES="${{ steps.instances.outputs.instance-ids }}"
          for instance in $INSTANCES; do
            echo "Updating Docker image on instance $instance"
            aws ssm send-command \
              --document-name "AWS-RunShellScript" \
              --instance-ids "$instance" \
              --parameters 'commands=[
                "docker pull ${{ needs.build.outputs.image-tag }}",
                "docker stop muchtodo-api || true",
                "docker rm muchtodo-api || true",
                "docker run -d --name muchtodo-api --restart unless-stopped -p 8080:8080 -e MONGO_URI=${{ secrets.MONGO_URI }} -e REDIS_ADDR=${{ secrets.REDIS_ADDR }} -e JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} ${{ needs.build.outputs.image-tag }}"
              ]' \
              --output text
          done

      - name: Wait for instance updates to complete
        run: sleep 30

      - name: Run enhanced smoke tests against ALB
        id: smoke-tests
        run: |
          set -e
          ALB_URL="http://${{ secrets.ALB_DNS }}"
          MAX_RETRIES=15
          RETRY_DELAY=3
          
          echo "🔍 Starting Enhanced Smoke Tests..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Test 1: Health endpoint with retries
          echo ""
          echo "Test 1️⃣ : Health Endpoint Check"
          HEALTH_CHECK_PASSED=false
          for i in $(seq 1 $MAX_RETRIES); do
            echo "  Attempt $i/$MAX_RETRIES..."
            HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/health.json "$ALB_URL/health")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "  ✅ Health endpoint responded with HTTP 200"
              HEALTH_CHECK_PASSED=true
              
              # Validate response contains expected fields
              if grep -q '"database"' /tmp/health.json; then
                echo "  ✅ Response contains database status"
              fi
              if grep -q '"cache"' /tmp/health.json; then
                echo "  ✅ Response contains cache status"
              fi
              break
            else
              echo "  ⏳ Waiting ${RETRY_DELAY}s before retry... (HTTP $HTTP_CODE)"
              sleep $RETRY_DELAY
            fi
          done
          
          if [ "$HEALTH_CHECK_PASSED" = false ]; then
            echo "  ❌ Health endpoint check FAILED"
            exit 1
          fi
          
          # Test 2: Service Status Verification
          echo ""
          echo "Test 2️⃣ : Service Status Verification"
          HEALTH_RESPONSE=$(cat /tmp/health.json)
          echo "  Response: $HEALTH_RESPONSE"
          
          if echo "$HEALTH_RESPONSE" | grep -q '"database":"ok"'; then
            echo "  ✅ Database is connected"
          else
            echo "  ⚠️  Database may not be connected"
          fi
          
          if echo "$HEALTH_RESPONSE" | grep -q '"cache":"ok"'; then
            echo "  ✅ Cache is connected"
          else
            echo "  ℹ️  Cache is disabled or not connected (expected if disabled)"
          fi
          
          # Test 3: Swagger Documentation
          echo ""
          echo "Test 3️⃣ : Swagger Documentation"
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/swagger.html "$ALB_URL/swagger/index.html")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "  ✅ Swagger docs accessible (HTTP 200)"
            if grep -q "swagger" /tmp/swagger.html; then
              echo "  ✅ Swagger page loaded successfully"
            fi
          else
            echo "  ❌ Swagger docs not accessible (HTTP $HTTP_CODE)"
            exit 1
          fi
          
          # Test 4: Performance Check
          echo ""
          echo "Test 4️⃣ : Performance Check"
          START_TIME=$(date +%s%N)
          curl -s -o /dev/null "$ALB_URL/health"
          END_TIME=$(date +%s%N)
          RESPONSE_TIME_MS=$(( (END_TIME - START_TIME) / 1000000 ))
          echo "  Response time: ${RESPONSE_TIME_MS}ms"
          
          if [ "$RESPONSE_TIME_MS" -lt 1000 ]; then
            echo "  ✅ Response time excellent (<1s)"
          elif [ "$RESPONSE_TIME_MS" -lt 2000 ]; then
            echo "  ✅ Response time acceptable (<2s)"
          else
            echo "  ⚠️  Response time slow (>${RESPONSE_TIME_MS}ms)"
          fi
          
          # Test 5: HTTP Headers Validation
          echo ""
          echo "Test 5️⃣ : HTTP Headers Validation"
          HEADERS=$(curl -s -i "$ALB_URL/health" 2>/dev/null | head -20)
          
          if echo "$HEADERS" | grep -q "Content-Type.*application/json"; then
            echo "  ✅ Content-Type is application/json"
          else
            echo "  ⚠️  Unexpected Content-Type"
          fi
          
          if echo "$HEADERS" | grep -q "Access-Control-Allow-Origin"; then
            echo "  ✅ CORS headers present"
          fi
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ All smoke tests PASSED"

      - name: Test API Authentication
        run: |
          echo ""
          echo "🔐 Testing Authentication Endpoints"
          ALB_URL="http://${{ secrets.ALB_DNS }}"
          
          # Test that auth endpoints exist
          echo "Checking /api/auth/register endpoint..."
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /dev/null -X POST "$ALB_URL/api/auth/register" \
            -H "Content-Type: application/json" \
            -d '{"username":"test","password":"test"}' 2>/dev/null)
          
          # 400/422 is expected (bad input), 404 means endpoint missing
          if [ "$HTTP_CODE" != "404" ]; then
            echo "  ✅ Auth endpoints are available (HTTP $HTTP_CODE)"
          else
            echo "  ⚠️  Auth endpoint returned 404"
          fi
          
          # Test that protected endpoints require auth
          echo "Checking protected endpoint authentication..."
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /dev/null -X GET "$ALB_URL/api/todos" 2>/dev/null)
          
          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "  ✅ Protected endpoints require authentication (HTTP $HTTP_CODE)"
          elif [ "$HTTP_CODE" = "200" ]; then
            echo "  ⚠️  Protected endpoint accessible without auth (HTTP 200)"
          else
            echo "  ℹ️  Protected endpoint returned HTTP $HTTP_CODE"
          fi

      - name: Verify API endpoints
        run: |
          echo ""
          echo "🌐 Verifying Critical Endpoints"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          ALB_URL="http://${{ secrets.ALB_DNS }}"
          
          endpoints=(
            "GET /health"
            "GET /swagger/index.html"
            "GET /api/health"
          )
          
          for endpoint in "${endpoints[@]}"; do
            METHOD=$(echo $endpoint | cut -d' ' -f1)
            PATH=$(echo $endpoint | cut -d' ' -f2)
            
            echo "Testing: $METHOD $PATH"
            HTTP_CODE=$(curl -s -w "%{http_code}" -o /dev/null -X "$METHOD" "$ALB_URL$PATH")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "  ✅ $PATH is responding (HTTP 200)"
            elif [ "$HTTP_CODE" = "404" ]; then
              echo "  ❌ $PATH not found (HTTP 404)"
              exit 1
            else
              echo "  ℹ️  $PATH returned HTTP $HTTP_CODE"
            fi
          done
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ All endpoint tests completed"

      - name: Configure CloudWatch Log Group
        run: |
          aws logs create-log-group \
            --log-group-name /aws/ec2/muchtodo-backend \
            --region ${{ env.AWS_REGION }} || true
          
          aws logs put-retention-policy \
            --log-group-name /aws/ec2/muchtodo-backend \
            --retention-in-days 30

      - name: Send deployment success notification
        uses: slackapi/slack-github-action@v1.24.0
        if: success()
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ Backend deployment succeeded",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✅ Backend Deployment Successful*\n*Environment:* Production\n*Branch:* main\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Author:* ${{ github.actor }}\n*API URL:* http://${{ secrets.ALB_DNS }}/health"
                  }
                }
              ]
            }

      - name: Send deployment failure notification
        uses: slackapi/slack-github-action@v1.24.0
        if: failure()
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ Backend deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*❌ Backend Deployment Failed*\n*Environment:* Production\n*Branch:* main\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Author:* ${{ github.actor }}\n*Action URL:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }

      - name: Update deployment status (success)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          state: success
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          environment-url: http://${{ secrets.ALB_DNS }}/health

      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          state: failure
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}