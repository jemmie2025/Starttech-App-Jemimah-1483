version: "3.9"
# -----------------------------
# MongoDB Service
# -----------------------------
services:
mongodb:
image: mongo:8.0
container_name: mongodb
restart: unless-stopped
ports:
- "${MONGO_PORT:-27017}:27017"
environment:
MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-example}
MONGO_INITDB_DATABASE: ${DB_NAME:-much_todo_db}
volumes:
- mongo_data:/data/db
healthcheck:
test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
interval: 10s
timeout: 10s
retries: 5
start_period: 40s
networks:
- backend
extra_hosts:
- "host.docker.internal:host-gateway"

# -----------------------------
# Go Backend API
# -----------------------------
backend:
build:
context: ./server/MuchToDo
dockerfile: Dockerfile
container_name: backend-api
ports:
- "8080:8080"
depends_on:
- mongodb
- redis
environment:
PORT: 8080
MONGO_URI: mongodb://root:example@mongodb:27017/much_todo_db?authSource=admin
JWT_SECRET_KEY: ${JWT_SECRET_KEY}
REDIS_ADDR: redis:6379
restart: always
networks:
- backend

# -----------------------------
# Mongo Express
# -----------------------------
mongo-express:
image: mongo-express:1.0.2
container_name: mongo-express
restart: unless-stopped
depends_on:
- mongodb
- redis
ports:
- "8081:8081"
environment:
ME_CONFIG_MONGODB_URL: mongodb://root:example@mongodb:27017/?authSource=admin
ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME:-admin}
ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD:-admin123}
networks:
- backend

# -----------------------------
# Redis
# -----------------------------
redis:
image: redis:7.2
container_name: redis
restart: unless-stopped
ports:
- "${REDIS_PORT:-6379}:6379"
command: ["redis-server", "--appendonly", "yes"]
volumes:
- redis_data:/data
networks:
- backend

# -----------------------------
# Redis Commander
# -----------------------------
redis-commander:
image: rediscommander/redis-commander:latest
container_name: redis-commander
restart: unless-stopped
depends_on:
- redis
ports:
- "8082:8081"
environment:
- REDIS_HOSTS=local:${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
networks:
- backend

# -----------------------------
# Volumes
# -----------------------------
volumes:
mongo_data:
redis_data:

# -----------------------------
# Networks
# -----------------------------
networks:
backend:
driver: bridge
